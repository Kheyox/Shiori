server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index kobo-converter.html;

    # Bloquer l'accès aux fichiers/dossiers techniques
    location ~ ^/(\.git|\.github|\.agents|\.firebase|docker-compose\.yml|nginx\.conf|firebase\.json|\.firebaserc|\.gitignore|README\.md|DEPLOY\.md) {
        return 404;
    }

    # Pas de cache pour l'app HTML, le Service Worker et le manifest
    location ~* ^/(kobo-converter\.html|sw\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Cache long pour les icônes/images
    location ~* \.(png|jpg|jpeg|svg|webp|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Redirection des URLs inconnues vers kobo-converter.html (comme firebase.json)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /kobo-converter.html;
    }
}
